# Checks that the HelloWorld nevers breaks, like True Metal

name: Hello World CI

on:
  workflow_dispatch:
jobs:
  testTrueMetal:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean package

    - name: Test with Maven
      run: mvn test

    - name: Detect container engine
      run: |
        # windows-11-arm ships without Docker, and no Windows ARM64 base images exist for it,
        # so there the same WAR is served from a native Tomcat instead of a container
        if command -v docker >/dev/null 2>&1; then
          echo "DOCKER_AVAILABLE=true" >> "$GITHUB_ENV"
        else
          echo "DOCKER_AVAILABLE=false" >> "$GITHUB_ENV"
        fi

    - name: Set up native Tomcat
      if: env.DOCKER_AVAILABLE == 'false'
      run: |
        v=10.1.34
        temp=$(cygpath -u "$RUNNER_TEMP")
        curl -fsSL -o "$temp/tomcat.zip" "https://archive.apache.org/dist/tomcat/tomcat-10/v$v/bin/apache-tomcat-$v.zip"
        powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$temp/tomcat.zip")' -DestinationPath '$(cygpath -w "$temp")'"
        home="$temp/apache-tomcat-$v"
        rm -rf "$home/webapps/ROOT"
        cp target/nano.war "$home/webapps/ROOT.war"
        echo "TOMCAT_HOME=$home" >> "$GITHUB_ENV"
        echo "CATALINA_HOME=$(cygpath -w "$home")" >> "$GITHUB_ENV"

    - name: Build Docker image
      if: env.DOCKER_AVAILABLE == 'true'
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Windows runners only support Windows containers; the base image must match the host build
          build=$(powershell -NoProfile -Command "[Environment]::OSVersion.Version.Build" | tr -d '\r')
          case "$build" in
            20348) ltsc=ltsc2022 ;;
            *) ltsc=ltsc2025 ;;
          esac
          docker build -f Dockerfile.windows --build-arg WINDOWS_LTSC=$ltsc -t my-java-app .
        else
          docker build -t my-java-app .
        fi

    - name: Run Docker container
      if: env.DOCKER_AVAILABLE == 'true'
      run: docker run -d -p 8080:8080 --name my-java-app-container my-java-app

    - name: Start native Tomcat
      if: env.DOCKER_AVAILABLE == 'false'
      run: |
        cd "$TOMCAT_HOME/bin"
        cmd //c startup.bat

    - name: Wait for the service to be available
      run: |
        for i in $(seq 1 60); do
          if curl -s -o /dev/null http://localhost:8080; then
            exit 0
          fi
          sleep 5
        done
        if [ "$DOCKER_AVAILABLE" = "true" ]; then
          docker logs my-java-app-container
        else
          cat "$TOMCAT_HOME"/logs/* || true
        fi
        exit 1

    - name: Test the service
      run: |
        curl -s http://localhost:8080 | grep "Hello World!"

    - name: Stop and remove Docker container
      if: env.DOCKER_AVAILABLE == 'true'
      run: docker stop my-java-app-container && docker rm my-java-app-container

    - name: Stop native Tomcat
      if: env.DOCKER_AVAILABLE == 'false'
      run: |
        cd "$TOMCAT_HOME/bin"
        cmd //c shutdown.bat

    - name: Clean up Docker
      if: env.DOCKER_AVAILABLE == 'true'
      run: docker rmi my-java-app
    name: testTrueMetal [${{ matrix.expander_leg }}]
    timeout-minutes: 150
